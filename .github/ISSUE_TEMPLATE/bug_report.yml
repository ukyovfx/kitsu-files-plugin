name: Bug report
description: Report a reproducible defect in the in-development plugin.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, personal data, production media, private server addresses, or database dumps. Do not report security vulnerabilities here; follow SECURITY.md.
  - type: input
    id: commit
    attributes:
      label: Commit or draft PR
      description: Provide the exact source SHA or draft PR number.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized test environment
      description: Name the pinned disposable host and whether FakeStorage or a synthetic provider was used.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic identities and data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Relevant checks
      description: Include commands and results. Distinguish local tests from installed-host or provider evidence.
