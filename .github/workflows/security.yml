name: Security and frontend checks

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: go run github.com/zricethezav/gitleaks/v8@v8.25.1 git --redact --no-banner .

  frontend:
    name: Frontend dependency, test, and build checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Create frontend SBOM
        run: npm sbom --package-lock-only --sbom-format cyclonedx > "$RUNNER_TEMP/frontend-sbom.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-sbom
          path: ${{ runner.temp }}/frontend-sbom.cdx.json
          if-no-files-found: warn

  plugin-security:
    name: Pinned host dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Export dependencies from the immutable host image
        run: >-
          docker run --rm
          --entrypoint /opt/zou/env/bin/python
          cgwire/cgwire:1.0.70-1.0.94-01@sha256:e6d9021241b12f88616762b4c7600a5e84d646119cba4a153ce7908fbd4f300a
          -m pip freeze > "$RUNNER_TEMP/host-requirements.txt"
      - name: Audit pinned host runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit --requirement "$RUNNER_TEMP/host-requirements.txt" --format cyclonedx-json --output "$RUNNER_TEMP/host-sbom.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pinned-host-sbom
          path: ${{ runner.temp }}/host-sbom.cdx.json
          if-no-files-found: warn

  python-static:
    name: Python syntax and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q plugin worker tests
      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit==1.8.6
      - name: Scan plugin Python security patterns
        run: bandit --recursive plugin --severity-level medium --confidence-level medium
