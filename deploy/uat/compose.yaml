x-uat-logging: &uat-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:14-alpine@sha256:4ea9e5ed06591da7ea23eb65465e8d3187fe79f4d5ec3ae976d29a33b013e77a
    environment:
      POSTGRES_DB: vfxfiles_uat
      POSTGRES_USER: vfxfiles_uat
      POSTGRES_PASSWORD: ${VFX_FILES_UAT_DB_PASSWORD:?Run init.ps1 first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [uat]
    cgroup_parent: ${VFX_FILES_UAT_CGROUP_PARENT:-}
    logging: *uat-logging
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfxfiles_uat -d vfxfiles_uat"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$${VFX_FILES_UAT_REDIS_PASSWORD}\""]
    environment:
      VFX_FILES_UAT_REDIS_PASSWORD: ${VFX_FILES_UAT_REDIS_PASSWORD:?Run init.ps1 first}
    volumes:
      - redis_data:/data
    networks: [uat]
    cgroup_parent: ${VFX_FILES_UAT_CGROUP_PARENT:-}
    logging: *uat-logging
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$VFX_FILES_UAT_REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  egress-guard:
    image: vfx-files-uat-egress-guard:${VFX_FILES_UAT_SOURCE_SHORT:?Run build.ps1 first}
    build:
      context: ./firewall
      dockerfile: Dockerfile
    environment:
      VFX_FILES_UAT_BACKEND_SUBNET: ${VFX_FILES_UAT_BACKEND_SUBNET:?Run init.ps1 first}
    command:
      - sh
      - -ec
      - >-
        iptables -F OUTPUT;
        iptables -P OUTPUT DROP;
        iptables -A OUTPUT -o lo -j ACCEPT;
        iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT;
        iptables -A OUTPUT -d "$${VFX_FILES_UAT_BACKEND_SUBNET}" -j ACCEPT;
        ip6tables -F OUTPUT;
        ip6tables -P OUTPUT DROP;
        ip6tables -A OUTPUT -o lo -j ACCEPT;
        ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT;
        exec sleep infinity
    networks: [uat, ingress]
    cgroup_parent: ${VFX_FILES_UAT_CGROUP_PARENT:-}
    ports:
      - "127.0.0.1:${VFX_FILES_UAT_HTTP_PORT:-55280}:80"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    logging: *uat-logging
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "iptables -C OUTPUT -d \"$VFX_FILES_UAT_BACKEND_SUBNET\" -j ACCEPT && iptables -S OUTPUT | grep -q '^-P OUTPUT DROP' && ip6tables -S OUTPUT | grep -q '^-P OUTPUT DROP'"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: vfx-files-uat-app:${VFX_FILES_UAT_SOURCE_SHORT:?Run build.ps1 first}
    build:
      context: ../..
      dockerfile: deploy/uat/Dockerfile
      args:
        CANDIDATE_IMAGE: ${VFX_FILES_UAT_CANDIDATE_IMAGE:?Run build.ps1 first}
        SOURCE_HEAD: ${VFX_FILES_UAT_SOURCE_HEAD:?Run build.ps1 first}
    environment:
      SECRET_KEY: ${VFX_FILES_UAT_SECRET_KEY:?Run init.ps1 first}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: vfxfiles_uat
      DB_USERNAME: vfxfiles_uat
      DB_PASSWORD: ${VFX_FILES_UAT_DB_PASSWORD:?Run init.ps1 first}
      KV_HOST: redis
      KV_PORT: "6379"
      KV_PASSWORD: ${VFX_FILES_UAT_REDIS_PASSWORD:?Run init.ps1 first}
      PLUGIN_FOLDER: /opt/zou/plugins
      VFX_FILES_ENABLED: ${VFX_FILES_ENABLED:-false}
      # The API uses this flag to report upload readiness; it does not launch
      # an in-process Worker. The Worker service remains opt-in via its profile.
      VFX_FILES_WORKER_ENABLED: ${VFX_FILES_WORKER_ENABLED:-false}
      VFX_FILES_DISPOSABLE_TEST_MODE: "1"
      VFX_FILES_E2E_ROOT_URL: http://127.0.0.1:${VFX_FILES_UAT_HTTP_PORT:-55280}
      VFX_FILES_E2E_TEST_PASSWORD: ${VFX_FILES_UAT_TEST_PASSWORD:?Run init.ps1 first}
      VFX_FILES_STORAGE_MODE: fake
      VFX_FILES_FAKE_STORAGE_ROOT: /var/lib/vfx-files/fake/fake-storage.json
      VFX_FILES_FAKE_ROOT_ID: synthetic-root-id
      VFX_FILES_FAKE_DRIVE_ID: synthetic-drive-id
      VFX_FILES_STAGING_ROOT: /var/lib/vfx-files/staging
      VFX_FILES_KITSU_ORIGIN: http://127.0.0.1:${VFX_FILES_UAT_HTTP_PORT:-55280}
      VFX_FILES_KITSUSYNC_ISSUER: ${VFX_FILES_KITSUSYNC_ISSUER:-}
      VFX_FILES_KITSUSYNC_AUDIENCE: ${VFX_FILES_KITSUSYNC_AUDIENCE:-}
      VFX_FILES_KITSUSYNC_SUBJECT: ${VFX_FILES_KITSUSYNC_SUBJECT:-}
      VFX_FILES_KITSUSYNC_CLIENT_ID: ${VFX_FILES_KITSUSYNC_CLIENT_ID:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      egress-guard: {condition: service_healthy}
    volumes:
      - staging_data:/var/lib/vfx-files/staging
      - fake_storage:/var/lib/vfx-files/fake
      - restore_state:/var/lib/vfx-files/restore
      - zou_previews:/opt/zou/previews
      - zou_postgresql_unused:/var/lib/postgresql:ro
    network_mode: "service:egress-guard"
    cgroup_parent: ${VFX_FILES_UAT_CGROUP_PARENT:-}
    logging: *uat-logging
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    tmpfs: [/tmp, /run, /var/log/nginx]
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test: ["CMD", "/opt/zou/env/bin/python", "/opt/vfx-files-uat/check_api_health.py"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  worker:
    image: vfx-files-uat-app:${VFX_FILES_UAT_SOURCE_SHORT:?Run build.ps1 first}
    profiles: [worker]
    command: ["/opt/zou/env/bin/python", "-m", "vfx_files.worker_runtime", "--poll", "--idle-seconds", "2"]
    environment:
      SECRET_KEY: ${VFX_FILES_UAT_SECRET_KEY:?Run init.ps1 first}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: vfxfiles_uat
      DB_USERNAME: vfxfiles_uat
      DB_PASSWORD: ${VFX_FILES_UAT_DB_PASSWORD:?Run init.ps1 first}
      KV_HOST: redis
      KV_PORT: "6379"
      KV_PASSWORD: ${VFX_FILES_UAT_REDIS_PASSWORD:?Run init.ps1 first}
      PLUGIN_FOLDER: /opt/zou/plugins
      VFX_FILES_ENABLED: ${VFX_FILES_ENABLED:-false}
      VFX_FILES_WORKER_ENABLED: ${VFX_FILES_WORKER_ENABLED:-false}
      VFX_FILES_STORAGE_MODE: fake
      VFX_FILES_FAKE_STORAGE_ROOT: /var/lib/vfx-files/fake/fake-storage.json
      VFX_FILES_FAKE_ROOT_ID: synthetic-root-id
      VFX_FILES_FAKE_DRIVE_ID: synthetic-drive-id
      VFX_FILES_STAGING_ROOT: /var/lib/vfx-files/staging
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
    volumes:
      - staging_data:/var/lib/vfx-files/staging
      - fake_storage:/var/lib/vfx-files/fake
      - restore_state:/var/lib/vfx-files/restore
      - zou_previews:/opt/zou/previews
      - zou_postgresql_unused:/var/lib/postgresql:ro
    networks: [uat]
    cgroup_parent: ${VFX_FILES_UAT_CGROUP_PARENT:-}
    logging: *uat-logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256

networks:
  uat:
    internal: true
    ipam:
      config:
        - subnet: ${VFX_FILES_UAT_BACKEND_SUBNET:?Run init.ps1 first}
    labels:
      com.vfx-files.uat: "true"
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.enable_ipv6: "false"
    ipam:
      config:
        - subnet: ${VFX_FILES_UAT_INGRESS_SUBNET:?Run init.ps1 first}
    labels:
      com.vfx-files.uat: "true"

volumes:
  postgres_data:
    labels: {com.vfx-files.uat: "true"}
  redis_data:
    labels: {com.vfx-files.uat: "true"}
  staging_data:
    labels: {com.vfx-files.uat: "true"}
  fake_storage:
    labels: {com.vfx-files.uat: "true"}
  restore_state:
    labels: {com.vfx-files.uat: "true"}
  zou_previews:
    labels: {com.vfx-files.uat: "true"}
  zou_postgresql_unused:
    labels: {com.vfx-files.uat: "true"}
