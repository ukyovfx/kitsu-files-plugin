[supervisord]
nodaemon = True
umask = 022

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
stopwaitsecs = 10
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:gunicorn]
environment=PREVIEW_FOLDER=/opt/zou/previews
command=/opt/zou/env/bin/gunicorn -c /etc/zou/gunicorn.py -b 127.0.0.1:5000 --chdir /opt/zou/zou zou.app:app
directory=/opt/zou
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=NONE
stderr_logfile=NONE

[program:gunicorn-events]
command=/opt/zou/env/bin/gunicorn -c /etc/zou/gunicorn-events.py -b 127.0.0.1:5001 zou.event_stream:app
directory=/opt/zou
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=NONE
stderr_logfile=NONE

[group:zou-processes]
programs=gunicorn,gunicorn-events
priority=5
